name: Tests

on:
  push:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Integration and Unit tests
    runs-on:
      group: organization/Default
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        php: [8.1, 8.2, 8.3, 8.4]
    env:
      PUBLISH_KEY: ${{ secrets.SDK_PUB_KEY }}
      SUBSCRIBE_KEY: ${{ secrets.SDK_SUB_KEY }}
      SECRET_KEY: ${{ secrets.SDK_SEC_KEY }}
      PUBLISH_PAM_KEY: ${{ secrets.SDK_PAM_PUB_KEY }}
      SUBSCRIBE_PAM_KEY: ${{ secrets.SDK_PAM_SUB_KEY }}
      SECRET_PAM_KEY: ${{ secrets.SDK_PAM_SEC_KEY }}
      UUID_MOCK: "test-user"
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Checkout actions
        uses: actions/checkout@v4
        with:
          repository: pubnub/client-engineering-deployment-tools
          ref: v1
          token: ${{ secrets.GH_TOKEN }}
          path: .github/.release/actions
      - name: Determine composer cache directory
        id: composer-cache-dir
        run: echo "dir=$(composer config cache-dir)" >> $GITHUB_OUTPUT
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            "${{ steps.composer-cache-dir.outputs.dir }}"
            ${{ github.workspace }}/vendor
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: phpunit
          coverage: none
      - name: Setup dependencies
        run: |
          composer self-update && composer --version
          composer install --prefer-dist
      # TEMPORARY: diagnose intermittent `cURL error 28` timeouts to ps.pndsn.com
      # from the self-hosted runner. Remove once the runner egress issue is resolved.
      - name: Diagnose ps.pndsn.com connectivity
        continue-on-error: true
        run: |
          echo "=== Runner public egress IP ==="
          curl -s --max-time 15 https://api.ipify.org || echo "(could not determine egress IP)"
          echo
          echo "=== DNS resolution for ps.pndsn.com ==="
          getent hosts ps.pndsn.com || nslookup ps.pndsn.com || true
          echo
          echo "=== Proxy-related environment ==="
          env | grep -iE 'proxy' || echo "(no proxy env vars set)"
          echo
          echo "=== 10x probe of https://ps.pndsn.com/time/0 (catch intermittent hang) ==="
          for i in $(seq 1 10); do
            echo "--- attempt $i ---"
            curl -sS -o /dev/null --max-time 15 \
              -w 'http_code=%{http_code} dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s\n' \
              "https://ps.pndsn.com/time/0" \
              || echo "attempt $i FAILED (curl exit $?)"
          done
          echo
          echo "=== Burst probe: 200 requests, 20 concurrent (trip rate-limit/throttle under load) ==="
          # If the idle probe above is fast but requests here stall ~10s / fail with
          # exit 28, that points to server-side throttling under volume rather than a
          # broken network path. http_code 429 would confirm explicit rate-limiting.
          burst_log="$(mktemp)"
          seq 1 200 | xargs -P 20 -I {} \
            curl -sS -o /dev/null --max-time 15 \
              -w 'http_code=%{http_code} total=%{time_total}s\n' \
              "https://ps.pndsn.com/time/0" \
            >> "$burst_log" 2>&1 || true
          echo "--- HTTP status code distribution ---"
          grep -oE 'http_code=[0-9]+' "$burst_log" | sort | uniq -c || true
          echo "--- failures / non-200 / slow (>1s) responses ---"
          grep -vE 'http_code=200 total=0' "$burst_log" | grep -E 'http_code=(000|4|5)|total=[1-9]' || echo "(none — all fast 200s)"
          echo "--- slowest 5 responses ---"
          sort -t= -k3 -rn "$burst_log" | head -5 || true
      - name: Run unit tests
        run: composer test
      - name: Cancel workflow runs for commit on error
        if: failure()
        uses: ./.github/.release/actions/actions/utils/fast-jobs-failure
  acceptance-tests:
    name: Perform Acceptance BDD tests
    runs-on:
      group: organization/Default
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Checkout mock-server action
        uses: actions/checkout@v4
        with:
          repository: pubnub/client-engineering-deployment-tools
          ref: v1
          token: ${{ secrets.GH_TOKEN }}
          path: .github/.release/actions
      - name: Run mock server action
        uses: ./.github/.release/actions/actions/mock-server
        with:
          token: ${{ secrets.GH_TOKEN }}
      - name: Install Composer dev depenencies
        run: |
          composer install --dev
      - name: Run acceptance tests
        run: |
          composer acceptance-test
      - name: Cancel workflow runs for commit on error
        if: failure()
        uses: ./.github/.release/actions/actions/utils/fast-jobs-failure
      - name: Expose acceptance tests reports
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-test-reports
          path: ./tests/Acceptance/reports
  all-tests:
    name: Tests
    needs: [tests]
    runs-on:
      group: organization/Default
    steps:
      - name: Tests summary
        run: echo -e "\033[38;2;95;215;0m\033[1mAll tests successfully passed"
